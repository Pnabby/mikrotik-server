[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrotik"
version = "0.2.0"
description = "Multi-router FastAPI backend for MikroTik hotspot status and sessions."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "User" }
]
dependencies = [
  "routeros-api>=0.21.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
mikrotik = "mikrotik.__main__:main"
mikrotik-api = "mikrotik.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
