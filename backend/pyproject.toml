[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flintwifi-backend"
version = "0.3.0"
description = "FastAPI backend for the Vlad WiFi hotspot platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=46.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.4.0",
  "routeros-api>=0.21.0",
  "sqlalchemy>=2.0.30",
  "uvicorn>=0.30.0",
  "gunicorn>=23.0.0; platform_system != 'Windows'",
  "uvicorn-worker>=0.3.0; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
flintwifi-api = "app.__main__:main"
mikrotik = "app.cli:main"
flintwifi-seed = "app.commands.seed:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
